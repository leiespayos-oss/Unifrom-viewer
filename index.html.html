<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Stock Viewer System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            color: #333;
            transition: background .3s, color .3s;
        }

        /* LOGIN */
        .login-container {
            width: 350px;
            margin: 100px auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .login-container button {
            background: #007bff;
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #0056b3;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
            flex-direction: row;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #007bff;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nav-links button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .nav-links button:hover,
        .nav-links button.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            background: #f5f6f7;
            overflow-y: auto;
            transition: background .3s;
        }

        header {
            background: #007bff;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        section {
            display: none;
        }

        section.active {
            display: block;
        }

        /* Dashboard Summary */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Uniform Section */
        .uniform-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .uniform-group {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 15px;
        }

        .uniform-item {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .uniform-item img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }

        .view-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #0056b3;
        }

        /* Reports */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        /* Settings */
        .settings-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .settings-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 250px;
        }

        .settings-box input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .settings-box button {
            background: #007bff;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Help */
        .help-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .help-box textarea {
            width: 100%;
            height: 80px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 10px;
            padding: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .close-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Dark Mode */
        body.dark {
            background: #121212;
            color: #f5f5f5;
        }

        body.dark .main-content {
            background: #1e1e1e;
        }

        body.dark .sidebar {
            background: #0d1117;
        }

        body.dark .uniform-group,
        body.dark .settings-box,
        body.dark .help-box,
        .summary-card,
        .modal-content {
            background: #2a2a2a;
            color: #fff;
        }

        body.dark table {
            background: #2a2a2a;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="login-container" id="loginPage">
        <h2>Uniform Stock Viewer</h2>
        <input type="text" id="username" placeholder="Username (default: admin)">
        <input type="password" id="password" placeholder="Password (default: admin)">
        <button onclick="login()">Login</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <div class="sidebar">
            <div>
                <h2>Menu</h2>
                <div class="nav-links">
                    <button class="active" onclick="showSection('home',this)">🏠 Dashboard</button>
                    <button onclick="showSection('uniforms',this)">👕 Uniforms</button>
                    <button onclick="showSection('reports',this)">📊 Reports</button>
                    <button onclick="showSection('settings',this)">⚙️ Settings</button>
                    <button onclick="showSection('help',this)">❓ Help</button>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="main-content">
            <header>
                <h2>Uniform Stock Viewer System</h2>
            </header>

            <section id="home" class="active">
                <h3>Dashboard Overview</h3>
                <div class="dashboard-grid" id="dashboardGrid"></div>
            </section>

            <section id="uniforms">
                <h3>Uniform Inventory</h3>
                <div class="uniform-section" id="uniformList"></div>
            </section>

            <section id="reports">
                <h3>Stock Reports</h3>
                <table id="reportTable">
                    <tr>
                        <th>Item</th>
                        <th>Old Stock</th>
                        <th>Current Stock</th>
                        <th>Status</th>
                    </tr>
                </table>
            </section>

            <section id="settings">
                <h3>Settings</h3>
                <div class="settings-container">
                    <div class="settings-box">
                        <h4>👤 Manage Account</h4>
                        <input type="text" id="newUser" placeholder="New Username">
                        <input type="password" id="newPass" placeholder="New Password">
                        <button onclick="updateAccount()">Save</button>
                    </div>
                    <div class="settings-box">
                        <h4>🌓 Theme</h4>
                        <button onclick="toggleTheme()">Toggle Dark/Light</button>
                    </div>
                </div>
            </section>

            <section id="help">
                <h3>Help & Guidelines</h3>
                <div class="help-box">
                    <p><b>Guidelines:</b> Use the sidebar to view uniforms, check reports, and manage settings.</p>
                    <textarea id="askBox" placeholder="Type your question..."></textarea>
                    <button onclick="askHelp()">Send</button>
                    <p id="response"></p>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="stockModal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalStock"></p>
            <p id="modalOld"></p>
            <p id="modalStatus"></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let defaultUser = localStorage.getItem("user") || "admin";
        let defaultPass = localStorage.getItem("pass") || "admin";
        let isDark = localStorage.getItem("theme") === "dark";

        const uniforms = [
            { name: "Type A (Boys) - Uniform", stock: 25, old: 30, image: "type_a_boy.jpg.jpg" },
            { name: "Type A (Girls) - Uniform", stock: 22, old: 28, image: "type_a_girl.jpg.jpg" },
            { name: "Type B (Boys) - Uniform", stock: 18, old: 25, image: "type_b_boy.jpg.jpg" },
            { name: "Type B (Girls) - Uniform", stock: 20, old: 27, image: "type_b_girl.jpg.jpg" },
            { name: "PE Uniform (Boys)", stock: 40, old: 50, image: "pe_boy.jpg.jpg" },
            { name: "PE Uniform (Girls)", stock: 38, old: 48, image: "pe_girl.jpg.jpg" },
            { name: "Strand Shirt (ICT)", stock: 25, old: 30, image: "strand_short.jpg.jpg" }
        ];

        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            if (user === defaultUser && pass === defaultPass) {
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("dashboard").style.display = "flex";
                applyTheme(); renderAll();
            } else alert("Invalid credentials!");
        }
        function logout() {
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("loginPage").style.display = "block";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }
        function showSection(id, btn) {
            document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            document.querySelectorAll(".nav-links button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        }
        function updateAccount() {
            const newUser = document.getElementById("newUser").value.trim();
            const newPass = document.getElementById("newPass").value.trim();
            if (newUser) { defaultUser = newUser; localStorage.setItem("user", newUser); }
            if (newPass) { defaultPass = newPass; localStorage.setItem("pass", newPass); }
            alert("Account updated successfully!");
        }
        function toggleTheme() {
            isDark = !isDark;
            localStorage.setItem("theme", isDark ? "dark" : "light");
            applyTheme();
        }
        function applyTheme() { document.body.classList.toggle("dark", isDark); }
        function renderUniforms() {
            const c = document.getElementById("uniformList");
            c.innerHTML = "";
            uniforms.forEach((u, i) => {
                c.innerHTML += `
      <div class="uniform-group">
        <div class="uniform-item">
          <img src="${u.image}" alt="${u.name}">
          <div>
            <h4>${u.name}</h4>
            <p>Stock Left: <b>${u.stock}</b></p>
            <button class="view-btn" onclick="viewStock(${i})">View Stock</button>
          </div>
        </div>
      </div>`;
            });
        }
        function renderReport() {
            const t = document.getElementById("reportTable");
            t.innerHTML = "<tr><th>Item</th><th>Old Stock</th><th>Current Stock</th><th>Status</th></tr>";
            uniforms.forEach(u => {
                const s = u.stock < 10 ? "Low Stock" : "Available";
                t.innerHTML += `<tr><td>${u.name}</td><td>${u.old}</td><td>${u.stock}</td><td>${s}</td></tr>`;
            });
        }
        function renderDashboard() {
            const d = document.getElementById("dashboardGrid");
            d.innerHTML = "";
            uniforms.forEach(u => {
                d.innerHTML += `<div class="summary-card"><h4>${u.name}</h4><p>Stock Left: <b>${u.stock}</b></p></div>`;
            });
        }
        function renderAll() { renderUniforms(); renderReport(); renderDashboard(); }
        function viewStock(i) {
            const u = uniforms[i];
            document.getElementById("modalTitle").innerText = u.name;
            document.getElementById("modalStock").innerText = "Current Stock: " + u.stock;
            document.getElementById("modalOld").innerText = "Old Stock: " + u.old;
            document.getElementById("modalStatus").innerText = "Status: " + (u.stock < 10 ? "Low Stock" : "Available");
            document.getElementById("stockModal").style.display = "flex";
        }
        function closeModal() { document.getElementById("stockModal").style.display = "none"; }
        function askHelp() {
            const msg = document.getElementById("askBox").value.trim();
            if (!msg) return;
            document.getElementById("response").innerText = "✅ Your question has been sent: \"" + msg + "\"";
            document.getElementById("askBox").value = "";
        }
        applyTheme();
    </script>
</body>

</html>
